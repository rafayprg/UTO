<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#grad)" stroke-width="8" stroke-opacity="0.4" />
  <g filter="url(#glow)">
    <!-- Stylized 'L' and tool wrench motif -->
    <path d="M156 128 V356 C156 370 168 384 184 384 H356" fill="none" stroke="url(#grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dynamic spark / precision node -->
    <circle cx="356" cy="180" r="32" fill="url(#grad)" />
    <path d="M356 148 L356 212 M324 180 L388 180" stroke="#090d16" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
